# Pre-commit hooks per GIT_RULES.md §1.4 — run on every commit; never bypass
# with --no-verify (fix the hook in its own commit instead).
repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.7
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]   # 1 MB limit per GIT_RULES.md §1.4
      - id: end-of-file-fixer
      - id: check-merge-conflict
